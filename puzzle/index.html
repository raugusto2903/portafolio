<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle de Memoria | Portafolio de Ramiro Lamilla</title>
    <meta name="description" content="Juego de memoria con cartas: encuentra todas las parejas. Construido con JavaScript puro.">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header class="cabecera">
        <a href="../index.html" class="cabecera__volver">← Volver al portafolio</a>
        <h1 class="cabecera__titulo">Puzzle de <span class="acento">Memoria</span></h1>
    </header>

    <main class="contenedor">
        <section class="panel-info" aria-label="Estado del juego">
            <p>Encuentra todas las parejas de cartas iguales.</p>
            <div class="panel-info__datos">
                <span>Parejas: <strong id="parejas" class="acento">0</strong> / <span id="totalParejas">12</span></span>
                <span>Intentos: <strong id="intentos" class="acento">0</strong></span>
                <button type="button" id="reiniciar" class="boton-primario">Reiniciar</button>
            </div>
            <p id="mensaje" class="panel-info__mensaje" role="status"></p>
        </section>

        <section class="tablero" id="tablero" aria-label="Tablero de cartas"></section>
    </main>

    <script src="index.js"></script>
</body>
</html>
