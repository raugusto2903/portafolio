<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posición Global 2 | Portafolio de Ramiro Lamilla</title>
    <meta name="description" content="Mapa interactivo Leaflet que genera puntos aleatorios y los clasifica por cuadrante geográfico.">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header class="cabecera">
        <a href="../index.html" class="cabecera__volver">← Volver al portafolio</a>
        <h1 class="cabecera__titulo">Posición Global <span class="acento">2</span></h1>
    </header>

    <main class="contenedor">
        <!-- Panel de control -->
        <section class="panel" aria-label="Generador de puntos">
            <h2 class="panel__titulo">Generador de puntos</h2>
            <p class="panel__ayuda">
                Genera puntos aleatorios alrededor del punto medio, o haz clic
                sobre el mapa para agregar uno manualmente.
            </p>

            <div class="panel__formulario">
                <div class="panel__grupo">
                    <label for="number">Número de puntos</label>
                    <input type="number" id="number" min="1" class="campo" placeholder="Ej: 10">
                </div>
                <button type="button" id="button" class="boton-primario">Generar</button>
            </div>

            <h3 class="panel__subtitulo">Coordenadas</h3>
            <div class="panel__tabla">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Latitud</th>
                            <th scope="col">Longitud</th>
                        </tr>
                    </thead>
                    <tbody id="tablecordinates"></tbody>
                </table>
            </div>

            <h3 class="panel__subtitulo">Clasificación por cuadrante</h3>
            <div class="panel__tabla">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Latitud</th>
                            <th scope="col">Longitud</th>
                            <th scope="col">Cuadrante</th>
                        </tr>
                    </thead>
                    <tbody id="tableSort"></tbody>
                </table>
            </div>

            <div class="panel__contadores">
                <div class="contador">
                    <label for="textfield">Noroeste</label>
                    <input type="text" id="textfield" class="campo" readonly value="0">
                </div>
                <div class="contador">
                    <label for="textfield2">Noreste</label>
                    <input type="text" id="textfield2" class="campo" readonly value="0">
                </div>
                <div class="contador">
                    <label for="textfield3">Suroeste</label>
                    <input type="text" id="textfield3" class="campo" readonly value="0">
                </div>
                <div class="contador">
                    <label for="textfield4">Sureste</label>
                    <input type="text" id="textfield4" class="campo" readonly value="0">
                </div>
            </div>
        </section>

        <!-- Mapa -->
        <section class="mapa" aria-label="Mapa interactivo">
            <div id="mapid"></div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="index.js"></script>
</body>
</html>
