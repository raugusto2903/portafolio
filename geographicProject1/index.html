<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posición Global 1 | Portafolio de Ramiro Lamilla</title>
    <meta name="description" content="Mapa interactivo Leaflet que consulta puntos GPS de individuos desde la API de Movebank.">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header class="cabecera">
        <a href="../index.html" class="cabecera__volver">← Volver al portafolio</a>
        <h1 class="cabecera__titulo">Posición Global <span class="acento">1</span></h1>
    </header>

    <main class="contenedor">
        <!-- Panel de consulta -->
        <section class="panel" aria-label="Formulario de consulta de puntos">
            <h2 class="panel__titulo">Consulta de puntos</h2>

            <div class="panel__campo">
                <span class="panel__etiqueta">Nombre latín:</span>
                <span class="panel__valor" id="Name">—</span>
            </div>

            <div class="panel__formulario">
                <div class="panel__grupo">
                    <label for="number">Número de puntos</label>
                    <input type="number" id="number" min="1" class="campo" placeholder="Ej: 10">
                </div>
                <div class="panel__grupo">
                    <label for="select">Individuo</label>
                    <select id="select" class="campo"></select>
                </div>
                <button type="button" id="button" class="boton-primario">Consultar</button>
            </div>

            <div class="panel__tabla">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Latitud</th>
                            <th scope="col">Longitud</th>
                        </tr>
                    </thead>
                    <tbody id="tablecordinates"></tbody>
                </table>
            </div>
        </section>

        <!-- Mapa -->
        <section class="mapa" aria-label="Mapa interactivo">
            <div id="mapid"></div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="index.js"></script>
</body>
</html>
